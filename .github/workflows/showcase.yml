# The examples are external consumers of Viu's packaged SDKs and libraries. Everything restores from
# the assimalign GitHub Packages feed at the CI builds pinned in global.json and
# Directory.Build.props; the workflow token reads organization packages.
name: examples

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'Assimalign.Viu.Examples.slnx'
      - 'Directory.Build.*'
      - 'global.json'
      - 'nuget.config'
      - '.github/workflows/showcase.yml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
      - 'Assimalign.Viu.Examples.slnx'
      - 'Directory.Build.*'
      - 'global.json'
      - 'nuget.config'
      - '.github/workflows/showcase.yml'

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-24.04
    env:
      # Read by NuGet for the 'assimalign' source in nuget.config, including project-SDK resolution.
      NuGetPackageSourceCredentials_assimalign: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        # actions/setup-dotnet v4
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Install wasm-tools
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Restore
        run: dotnet restore Assimalign.Viu.Examples.slnx

      - name: Build
        run: dotnet build Assimalign.Viu.Examples.slnx --no-restore -warnaserror

      - name: Publish trimmed StandAlone app
        run: >-
          dotnet publish examples/2-StandAlone/Assimalign.Viu.Showcase.StandAlone
          --configuration Release
          -warnaserror
          --output ./_out/standalone

      - name: Verify the library stylesheet was published
        shell: pwsh
        run: |
          $css = './_out/standalone/wwwroot/_content/Assimalign.Viu.Showcase.Components/Assimalign.Viu.Showcase.Components.viu.css'
          if (-not (Test-Path -LiteralPath $css)) { throw "Missing $css" }
          if (-not (Get-Content -Raw -LiteralPath $css).Contains('.card')) { throw "$css does not contain the library styles." }
