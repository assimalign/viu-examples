# The examples are external consumers of Viu's packaged SDKs and libraries. Everything restores from
# the assimalign GitHub Packages feed at the builds (PR, CI, or release) pinned in global.json and
# Directory.Build.props; the workflow token reads organization packages.
name: examples

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'Assimalign.Viu.Examples.slnx'
      - 'Directory.Build.*'
      - 'global.json'
      - 'nuget.config'
      - 'scripts/Verify-LibraryStyles.ps1'
      - '.github/workflows/showcase.yml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
      - 'Assimalign.Viu.Examples.slnx'
      - 'Directory.Build.*'
      - 'global.json'
      - 'nuget.config'
      - 'scripts/Verify-LibraryStyles.ps1'
      - '.github/workflows/showcase.yml'

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-24.04
    env:
      # Read by NuGet for the 'assimalign' source in nuget.config, including project-SDK resolution.
      NuGetPackageSourceCredentials_assimalign: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        # actions/setup-dotnet v4
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Install wasm-tools
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Restore
        run: dotnet restore Assimalign.Viu.Examples.slnx

      - name: Build
        run: dotnet build Assimalign.Viu.Examples.slnx --no-restore -warnaserror

      # The slnx build includes the Gateway. Run it: it starts the Server as its managed showcase-web
      # resource on the in-process platform and prints the address that platform assigned.
      - name: Run the Cohesion gateway and check the managed site
        shell: bash
        run: |
          gateway_dll=$(find examples/3-Cohesion/Assimalign.Viu.Showcase.Cohesion.Gateway/bin/Debug -name Assimalign.Viu.Showcase.Cohesion.Gateway.dll | head -n 1)
          dotnet "$gateway_dll" > gateway.log 2>&1 &
          gateway=$!
          trap 'kill "$gateway" 2>/dev/null || true; cat gateway.log' EXIT
          for _ in $(seq 1 120); do
            grep -q '^showcase-web: ' gateway.log && break
            sleep 0.5
          done
          endpoint=$(sed -n 's/^showcase-web: //p' gateway.log | tr -d '\r' | head -n 1)
          test -n "$endpoint"
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 "$endpoint/" > /dev/null
          curl --fail --silent --show-error "$endpoint/api/tasks" > /dev/null
          client=$(curl --fail --silent --show-error "$endpoint/_cohesion/client.json")
          echo "$client"
          grep -q '"gateway":"inprocess"' <<< "$client"
          grep -q '"resource":"showcase-web"' <<< "$client"

      - name: Publish trimmed StandAlone app
        run: >-
          dotnet publish examples/2-StandAlone/Assimalign.Viu.Showcase.StandAlone
          --configuration Release
          -warnaserror
          --output ./_out/standalone

      - name: Verify the library stylesheet was published
        shell: pwsh
        run: ./scripts/Verify-LibraryStyles.ps1 -WebRoot ./_out/standalone/wwwroot

      # The marked ProjectReference participates in restore; no separate client restore is needed.
      - name: Publish Cohesion server and bundled client
        run: >-
          dotnet publish examples/3-Cohesion/Assimalign.Viu.Showcase.Cohesion.Server
          --configuration Release
          -warnaserror
          --output ./_out/cohesion

      - name: Verify bundled client styles
        shell: pwsh
        run: ./scripts/Verify-LibraryStyles.ps1 -WebRoot ./_out/cohesion/wwwroot
